# FUNCTIONALITY SETTINGS
broadcast_on_sendall: true
sendall_log: false

# 0 = total
# 1 = bonus
# 2 = accrued
# 3 = remaining
# 4 = remaining-bonus-cap
claimblocks_type: 4
type_names:
  total: "total"
  bonus: "bonus"
  accrued: "accrued"
  remaining: "remaining"
  remaining_bonus_cap: "remaining-bonus"

check_for_updates: true
separate_commands: false
request_expire_in: 2 #min

command_alias_gpsend:
  - "sendclaimblocks"

command_alias_gprequest:
  - "rqclaimblocks"

gui:
  choosing_gui:
    title: "    &0&lCHOOSE SENDING MODE"
    items:
      player:
        slot: 11
        material: SKULL_BANNER_PATTERN
        model_data: 0
        display_name: "&b&lSPECIFIC PLAYER"
        lore:
          - "&7Send claim blocks to"
          - "&7specific player"
          - " "
          - "&6Click to proceed."
      all:
        slot: 15
        material: FLOWER_BANNER_PATTERN
        model_data: 0
        display_name: "&b&lSEND TO EVERYONE"
        lore:
          - "&7Send claim blocks to"
          - "&7everyone online"
          - " "
          - "&6Click to proceed."

  player_list_gui:
    title: "        &0&lSELECT RECEIVER"
    items:
      player_head:
        display_name: "&fChoose &b&l%player% &fas receiver?"
      prev_page:
        slot: 48
        material: ARROW
        model_data: 0
        display_name: "&bPREVIOUS PAGE"
      page_info:
        slot: 49
        material: PAPER
        model_data: 0
        display_name: "&b%page%&f/&b%max%"
      next_page:
        slot: 50
        material: ARROW
        model_data: 0
        display_name: "&bNEXT PAGE"

  amount_gui:
    title: "  &0&lCHOOSE AMOUNT TO SEND"
    amounts:
      plus1: 1
      plus2: 10
      plus3: 100
      plus4: 1000
      minus1: 1
      minus2: 10
      minus3: 100
      minus4: 1000
    items:
      minus:
        slots: [12, 11, 10, 9]
        material: REDSTONE
        model_data: 0
        display_name: "&c&l- %amount%"
      info:
        slot: 13
        material: PAPER
        model_data: 0
        display_name: "&f&lSending to &b%mode%&f:"
        all_mode_name: "ALL"
        lore_target:
          - " "
          - "&fAmount: &b%amount% %affordable%"
        lore_all:
          - " "
          - "&fAmount: &b%amount% %affordable_single%"
          - "&fTotal: &b%total% %affordable%"
        affordable_no: "&c✖"
        affordable_yes: "&a✔"
      plus:
        slots: [14, 15, 16, 17]
        material: EMERALD
        model_data: 0
        display_name: "&a&l+ %amount%"
      confirm:
        slot: 22
        material: LIME_WOOL
        model_data: 0
        display_name: "&a&l✔ CONFIRM AND SEND ✔"

  info_item:
    material: OAK_SIGN
    model_data: 0
    display_name: "&b&lYOUR STATS:"
    lore:
      - " "
      - "&fYou can send up to:"
      - "&b&l%max_sendable% &b%mode% blocks&f."
      - " "
      - "&fYour blocks of all types:"
      - "&7Accrued: &b%accrued%"
      - "&7Bonus: &b%bonus%"
      - "&7Total: &b%total%"
      - "&7Remaining: &b%remaining%"
    modes:
      total: "Total only"
      bonus: "Bonus only"
      accrued: "Accrued only"
      remaining: "Remaining only"
      remaining_bonus: "remaining (capped to Bonus)"
    choosing_gui:
      display: true
      slot: 13
    player_list_gui:
      display: false
      slot: 53
    amount_gui:
      display: true
      slot: 4

# ERROR MESSAGES
invalid_amount: "&cInvalid amount. Please enter a valid number."
no_enough_blocks: "&cYou don't have enough %type% claim blocks to send! You need %need% more."
player_not_found: "&cTarget player not found or not online."
invalid_type: "&cInvalid argument for command."
no_permission: "&cYou don't have permission to use this command."
cannot_send_to_self: "&cYou cannot send claimblocks to yourself."
no_players: "&cNo online players found. (ignoring yourself)"
invalid_usage: "&cUsage: /gprequest new <player> <amount> &7or &c/gprequest accept/deny"
request_not_found: "&cYou don't have any pending requests!"
request_already_involved: "&cYou or that player already has an active request!"

# CHAT MESSAGES
sender: "&aYou have just sent %amount% %type% claim blocks to %target%."
receiver: "&a%player% just sent you %amount% %type% claim blocks."
broadcast_message: "&6%player% sent %amount% %type% claim blocks to everyone online, which is %total% in total."

request_sender_new: "&aSuccessfully requesting %amount% claimblocks from %target%."
request_target_new: "&a&l%owner% is REQUESTING %amount% claimblocks from you. Use '/gprequest accept' to send. This expires in 5min."
request_sender_expire: "&cYour claimblock request of %amount% to %target% has expired."
request_target_expire: "&cRequest from %owner% for %amount% claimblocks has expired."
request_sender_accept: "&a%target% accepted your request for %amount% claimblocks."
request_target_accept: "&aYou accepted %owner%'s request for %amount% claimblocks."
request_sender_deny: "&c%target% denied your request for %amount% claimblocks."
request_target_deny: "&cYou denied %owner%'s request for %amount% claimblocks."

# CLAIM BLOCK TYPES
#
# ACCRUED
#   Claim blocks earned naturally through play.
# BONUS
#   Claim blocks granted by admins or rewards.
# TOTAL
#   Accrued + Bonus.
# REMAINING
#   Total - Used claim blocks.
# REMAINING-BONUS-CAP
#   min(Remaining, Bonus)